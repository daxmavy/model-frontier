name: Refresh dataset and deploy

on:
  schedule:
    - cron: "20 6 * * *"        # 06:20 UTC daily
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run the tests
        run: |
          python -m unittest discover -s tests -v
          node --test 'tests/*.test.mjs'

      # If a source changes shape the build aborts, the job fails, and the
      # previously deployed site stays up rather than being replaced by junk.
      - name: Rebuild the dataset
        run: python pipeline/build.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
